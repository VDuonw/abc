<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cài đặt Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0c0a16;
    --bg-1:#130f22;
    --panel:#181330;
    --panel-2:#1e1836;
    --field:#231c42;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text-1:#f4f2fb;
    --text-2:#a79fc4;
    --text-3:#726b8f;
    --pink:#ff5f8f;
    --pink-dim:#ff5f8f22;
    --orange:#ffb648;
    --lav:#9d8cf5;
    --lav-dim:#9d8cf522;
    --teal:#3fd6ae;
    --teal-dim:#3fd6ae22;
    --red:#ff6b6b;
    --red-dim:#ff6b6b22;
    --amber:#ffc247;
    --amber-dim:#ffc24722;
    --blue:#5ba8ff;
    --blue-dim:#5ba8ff22;
    --radius-lg:20px;
    --radius-md:12px;
    --radius-sm:8px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(60% 55% at 78% 8%, #2a1f4a 0%, transparent 60%),
      radial-gradient(50% 45% at 12% 95%, #241a3d 0%, transparent 60%),
      var(--bg-0);
    font-family:'Inter',sans-serif;
    color:var(--text-1);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    overflow-x:hidden;
  }

  .stage{position:relative;width:100%;max-width:880px;}

  .glow{
    position:absolute;
    top:-60px; right:-40px;
    width:340px;height:340px;
    background:radial-gradient(circle, #ff5f8f30 0%, transparent 70%);
    filter:blur(10px);
    pointer-events:none;
  }

  .modal{
    position:relative;
    background:linear-gradient(180deg, var(--panel) 0%, var(--bg-1) 100%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6);
    overflow:hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 26px;
    border-bottom:1px solid var(--border);
  }
  .titlebar-left{display:flex;align-items:center;gap:12px;}
  .icon-badge{
    width:38px;height:38px;border-radius:11px;
    background:var(--lav-dim);
    display:flex;align-items:center;justify-content:center;
    color:var(--lav);
    flex-shrink:0;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    background:linear-gradient(90deg, var(--pink), var(--orange));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .close-btn{
    width:34px;height:34px;border-radius:50%;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-2);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .close-btn:hover{background:var(--field);color:var(--text-1);border-color:var(--border-strong);}

  .content{padding:24px 26px 26px;display:flex;flex-direction:column;gap:18px;}

  .row{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  @media (max-width:640px){.row{grid-template-columns:1fr;}}

  .card{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px 20px;
  }

  .card-label{
    display:flex;align-items:center;gap:9px;
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--text-1);
    margin-bottom:14px;
  }
  .card-label .lbl-icon{color:var(--pink);display:flex;}
  .card-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .card-header-row .card-label{margin-bottom:0;}

  label.field-label{
    display:block;font-size:12.5px;color:var(--text-2);margin-bottom:7px;
  }

  .input-wrap{position:relative;}
  input[type="password"], input[type="text"]{
    width:100%;
    background:var(--field);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:11px 40px 11px 13px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--text-1);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{color:var(--text-3);letter-spacing:2px;}
  input:focus{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-dim);}
  .eye-toggle{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    color:var(--text-3);cursor:pointer;display:flex;
    background:none;border:none;padding:4px;
  }
  .eye-toggle:hover{color:var(--text-2);}

  .helper{font-size:12.5px;color:var(--text-3);margin-top:9px;}
  .helper a{color:var(--lav);text-decoration:none;font-weight:500;}
  .helper a:hover{text-decoration:underline;}

  .avatar-row{display:flex;align-items:center;gap:14px;}
  .avatar-thumb{
    width:56px;height:56px;border-radius:var(--radius-sm);
    background:
      radial-gradient(circle at 50% 30%, #ffd8b0 0%, #f5a97f 45%, transparent 46%),
      linear-gradient(160deg, #3a2f5c, #241a3d);
    border:1px solid var(--border);
    flex-shrink:0;
  }
  .avatar-meta{flex:1;min-width:0;}
  .avatar-meta .name{font-size:13.5px;font-weight:500;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .avatar-meta .sub{font-size:12px;color:var(--text-3);margin-top:2px;}

  button.pill{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Inter',sans-serif;font-weight:500;font-size:13.5px;
    padding:9px 16px;border-radius:999px;border:none;cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  button.pill:active{transform:scale(0.97);}
  .pill-primary{
    background:linear-gradient(90deg, var(--pink), #ff8f6b);
    color:#2a0e1a;
  }
  .pill-primary:hover{filter:brightness(1.08);}
  .pill-ghost{
    background:var(--field);
    color:var(--text-2);
    border:1px solid var(--border);
  }
  .pill-ghost:hover{color:var(--text-1);border-color:var(--border-strong);}
  .full-w{width:100%;justify-content:center;}

  textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    background:var(--field);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:13px 14px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    line-height:1.65;
    color:var(--text-1);
    outline:none;
  }
  textarea:focus{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-dim);}

  .emotion-row{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:500;
    padding:6px 12px 6px 8px;
    border-radius:999px;
    border:1px solid transparent;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;}
  .chip-neutral{background:var(--field);color:var(--text-2);border-color:var(--border);}
  .chip-neutral .dot{background:var(--text-3);}
  .chip-happy{background:var(--amber-dim);color:var(--amber);}
  .chip-happy .dot{background:var(--amber);}
  .chip-angry{background:var(--red-dim);color:var(--red);}
  .chip-angry .dot{background:var(--red);}
  .chip-sad{background:var(--blue-dim);color:var(--blue);}
  .chip-sad .dot{background:var(--blue);}
  .chip-relaxed{background:var(--teal-dim);color:var(--teal);}
  .chip-relaxed .dot{background:var(--teal);}

  .footer{
    display:flex;justify-content:flex-end;gap:10px;
    padding:18px 26px;
    border-top:1px solid var(--border);
    background:var(--bg-1);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="modal">
    <div class="titlebar">
      <div class="titlebar-left">
        <div class="icon-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
        <h1>Cài đặt Game</h1>
      </div>
      <button class="close-btn" aria-label="Đóng">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="content">
      <div class="row">
        <div class="card">
          <div class="card-label">
            <span class="lbl-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
            </span>
            Gemini API key
          </div>
          <label class="field-label" for="apikey">Khóa API</label>
          <div class="input-wrap">
            <input type="password" id="apikey" value="AIzaSyD8f9k2mP4qR7vN1xW3zJ6tY0uL5cB8dHg">
            <button class="eye-toggle" aria-label="Hiện khóa">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <p class="helper">Lấy khóa miễn phí tại <a href="#">Google AI Studio</a></p>
        </div>

        <div class="card">
          <div class="card-label">
            <span class="lbl-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            Mô hình nhân vật
          </div>
          <div class="avatar-row">
            <div class="avatar-thumb"></div>
            <div class="avatar-meta">
              <div class="name">yuzuki_v2.vrm</div>
              <div class="sub">Chưa có tệp nào khác được tải</div>
            </div>
          </div>
          <button class="pill pill-primary full-w" style="margin-top:14px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M17 8l-5-5-5 5"></path><path d="M12 3v12"></path></svg>
            Mở tệp VRM
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header-row">
          <div class="card-label">
            <span class="lbl-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3z"></path></svg>
            </span>
            System prompt
          </div>
          <button class="pill pill-ghost">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            Đặt lại
          </button>
        </div>
        <textarea>あなたはこれからuserと仲の良い1人の人間として振舞い会話を行います。
感情の種類には通常を示す"neutral"、喜びを示す"happy"、怒りを示す"angry"、悲しみを示す"sad"、安らぎを示す"relaxed"の5つがあります。</textarea>
        <div class="emotion-row">
          <span class="chip chip-neutral"><span class="dot"></span>neutral — bình thường</span>
          <span class="chip chip-happy"><span class="dot"></span>happy — vui vẻ</span>
          <span class="chip chip-angry"><span class="dot"></span>angry — tức giận</span>
          <span class="chip chip-sad"><span class="dot"></span>sad — buồn bã</span>
          <span class="chip chip-relaxed"><span class="dot"></span>relaxed — thư giãn</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <button class="pill pill-ghost">Hủy</button>
      <button class="pill pill-primary">Lưu thay đổi</button>
    </div>
  </div>
</div>
</body>
</html>
